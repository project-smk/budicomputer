<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Usaha</title>
<link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgDe9GDtT8FV08iVmLcmqOn_xocE-bhY6Be78iNFq8Y_CGQtnlxXmOngnHjGqHsE4Lffgy4gKGA4MawDftRselAbk5oCNFZoXr8TRTp8vTKHIPMbveqFSgtSjlaBgclRi_qU9NJVBnw4aSpLQ08rHdyJbjfzYhnuez7mafH4RF5FwJ8XulcSiNICmhYwtLK/s320/BUDI%20KOMPUTER.png">
<link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgDe9GDtT8FV08iVmLcmqOn_xocE-bhY6Be78iNFq8Y_CGQtnlxXmOngnHjGqHsE4Lffgy4gKGA4MawDftRselAbk5oCNFZoXr8TRTp8vTKHIPMbveqFSgtSjlaBgclRi_qU9NJVBnw4aSpLQ08rHdyJbjfzYhnuez7mafH4RF5FwJ8XulcSiNICmhYwtLK/s320/BUDI%20KOMPUTER.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0F4C5C;--a:#B45309;--bg:#F4F7F8;--ink:#14262B;--mut:#4A5F66;--line:#D5E1E4;--fld:#8CA3AA}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--a)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h1,h2,h3{margin:0}
.meta{font-size:13px;color:var(--mut)}
.wrap{max-width:1200px;margin:0 auto;padding-inline:64px;width:100%}
/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:0 auto;padding:0 64px;min-height:72px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"b n l";align-items:center;gap:16px}
.brand{grid-area:b;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800;font-size:18px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;object-fit:cover}
#nav{grid-area:n;display:flex;gap:4px;justify-content:center}
.t{padding:10px 14px;border-radius:8px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.t:hover{background:var(--bg)}
.t[aria-current=page]{background:var(--p);color:#fff;font-weight:700}
.ib{grid-area:l;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--p);display:grid;place-items:center;cursor:pointer}
main{flex:1}
/* hero */
.hero{display:flex;gap:48px;align-items:center;padding:56px 0 8px}
.hero>div{flex:1;min-width:0}
.hero>div:first-child{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.hero h1{font-size:46px;line-height:1.12;font-weight:800}
.hero p{margin:0;font-size:17px;line-height:1.6;color:var(--mut);white-space:pre-line}
.hero img{width:100%;height:280px;object-fit:cover;border-radius:16px;display:block}
.btn{display:inline-block;background:var(--p);color:#fff;padding:13px 22px;border-radius:10px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:15px}
.btn.sm{padding:10px 16px}
.bt{background:#fff;border:1px solid var(--fld);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.bt.dng{color:#B42318;border-color:#B42318}
/* posts */
.posts{padding:40px 0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sh h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;color:inherit;text-decoration:none;min-width:0}
.card:hover{border-color:var(--p)}
.ph{width:100%;height:180px;border-radius:10px;background:var(--line);object-fit:cover;display:block;flex:none}
.cb{display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:19px;line-height:1.3}
.card p{margin:0;font-size:14px;color:var(--mut);line-height:1.6}
.more{font-weight:700;font-size:14px;color:var(--a)}
/* artikel & tab */
.art{max-width:760px;margin:0 auto;padding:40px 0}
.art h1{font-size:34px;line-height:1.2;margin:8px 0 20px}
.art img.cover{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:20px}
.art p{line-height:1.8;margin:0 0 16px}
.frame{width:100%;height:75vh;min-height:420px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}
.pad{padding:32px 0}
footer{margin-top:40px;background:var(--p);color:#fff;font-size:14px}
.fin{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px}
/* modal login */
.modal{position:fixed;inset:0;background:rgba(20,38,43,.55);display:grid;place-items:center;z-index:30;padding:16px}
.box{background:#fff;border-radius:16px;padding:24px;width:min(380px,100%)}
.box h2{font-size:20px;margin-bottom:16px}
.err{color:#B42318;font-size:14px;margin:8px 0 0;min-height:20px}
/* form */
.fg{margin-bottom:16px}
.fg label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.fg small{display:block;color:var(--mut);margin-top:4px;font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;padding:10px 12px;border:1px solid var(--fld);border-radius:8px;background:#fff}
input[type=color]{width:56px;height:40px;padding:2px;border:1px solid var(--fld);border-radius:8px;background:#fff}
.imgf{display:flex;gap:8px}
/* admin */
#admin{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.ah{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ah b{font-size:18px}
.ab{flex:1;display:flex;min-height:0}
.side{width:220px;background:#fff;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;flex:none}
.side button{text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;font-weight:600;cursor:pointer}
.side button[aria-current=true]{background:var(--p);color:#fff}
#ac{flex:1;overflow:auto;padding:24px;min-width:0}
.pane{max-width:760px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.ph2 h2{font-size:22px}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.li>div:first-child{min-width:0;display:flex;flex-direction:column}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.warn{background:#FEF3C7;border:1px solid #B45309;color:#5B2A04;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.tip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--mut);margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:40;font-size:14px;max-width:92vw}
#toast.bad{background:#B42318}
/* tablet */
@media(max-width:1023px){
  .bar{padding:12px 40px 0;grid-template-columns:1fr auto;grid-template-areas:"b l" "n n";gap:8px}
  #nav{justify-content:flex-start;overflow-x:auto;padding-bottom:8px}
  .wrap{padding-inline:40px}
  .hero{flex-direction:column;align-items:stretch;gap:16px;padding-top:40px}
  .hero h1{font-size:38px}
  .hero p{font-size:16px}
  .hero img{height:240px}
  .grid{grid-template-columns:1fr 1fr;gap:20px}
}
@media(min-width:640px) and (max-width:1023px){
  .grid .card:first-child{grid-column:1/-1;flex-direction:row;gap:20px}
  .grid .card:first-child .ph{width:300px;height:200px}
  .grid .card:first-child h3{font-size:22px}
}
/* HP */
@media(max-width:639px){
  .bar{padding:12px 16px 0}
  .wrap{padding-inline:16px}
  .hero{padding-top:24px;gap:12px}
  .hero h1{font-size:28px}
  .hero p{font-size:15px}
  .hero img{height:170px;border-radius:14px}
  .grid{grid-template-columns:1fr;gap:12px}
  .card{flex-direction:row;gap:12px;padding:12px;border-radius:12px}
  .card .ph{width:96px;height:96px;border-radius:8px}
  .card h3{font-size:16px}
  .card p{display:none}
  .art h1{font-size:26px}
  .ab{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side button{white-space:nowrap}
  #ac{padding:16px}
}
/* teks kaya (isi postingan) */
.rt{display:flow-root}
.rt p,.rt ul{margin:0 0 16px;line-height:1.8}
.rt ul{padding-left:24px}
.rt h2{font-size:24px;line-height:1.3;margin:28px 0 12px}
.rt .a-tengah{text-align:center}
.rt .a-kanan{text-align:right}
.rt .a-rata{text-align:justify}
.rt ul.a-tengah,.rt ul.a-kanan{list-style-position:inside;padding-left:0}
.rt figure.fi{margin:8px 0 20px;padding:0}
.rt figure.fi img{display:block;width:100%;height:auto;max-height:none;object-fit:initial;border-radius:10px;margin:0;background:var(--line)}
.rt .fi figcaption{font-size:13px;color:var(--mut);margin-top:6px;text-align:center;line-height:1.5}
.rt .fi.z-kecil{width:min(220px,100%)}
.rt .fi.z-sedang{width:min(400px,100%)}
.rt .fi.z-besar{width:min(600px,100%)}
.rt .fi.z-penuh{width:100%}
.rt .fi.p-tengah{margin-left:auto;margin-right:auto}
.rt .fi.p-kanan{margin-left:auto}
@media(min-width:640px){
  .rt .fi.p-kiri:not(.z-penuh){float:left;margin:6px 20px 12px 0}
  .rt .fi.p-kanan:not(.z-penuh){float:right;margin:6px 0 12px 20px}
}
/* toolbar editor */
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.tb .bt{padding:7px 10px;min-width:38px;display:inline-flex;align-items:center;justify-content:center}
.tb .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.ipn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px}
.ipn .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;max-height:460px;overflow:auto}
@media(max-width:639px){.ipn .row{grid-template-columns:1fr;gap:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <a class="brand" id="brand" href="#"><span id="logo"></span><span id="brandName"></span></a>
  <nav id="nav" aria-label="Menu utama"></nav>
  <button class="ib" id="btnAdmin" aria-label="Masuk admin"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
</div></header>
<main id="view"></main>
<footer><div class="wrap fin"><span id="fl"></span><span id="fr"></span></div></footer>

<div class="modal" id="modal" hidden><form class="box" id="loginForm" aria-labelledby="lt">
  <h2 id="lt">Masuk admin</h2>
  <div class="fg"><label for="lu">Username</label><input id="lu" autocomplete="username" required></div>
  <div class="fg"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required><label class="meta" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" class="sp"> Tampilkan password</label></div>
  <div class="err" id="lerr" role="alert"></div>
  <div class="acts" style="margin-top:8px"><button class="btn" id="lgo" type="submit">Masuk</button><button class="bt" type="button" id="lcancel">Batal</button></div>
</form></div>

<div id="admin" hidden>
  <div class="ah"><b>Panel Admin</b><div class="acts"><button class="bt" id="aview">Lihat situs</button><button class="bt" id="aout">Keluar</button></div></div>
  <div class="ab"><nav class="side" id="side" aria-label="Menu admin"></nav><div id="ac"></div></div>
</div>
<div id="toast" hidden role="status"></div>

<script>
/* ===== PENGATURAN: tempel URL web app Apps Script Anda di sini ===== */
var API_URL = 'https://script.google.com/macros/s/AKfycbz-Y9D54MLNd9W26HtTBMSCXbaKuOZhlrGF8EkUZA-5rmXQloWbXLA_u804yXCdYCg3/exec';   // contoh: https://script.google.com/macros/s/AKfy.../exec
/* =================================================================== */
var CK = 'wp_pub_v1';
var S = {s: {}, tabs: [], latest: [], total: 0, cur: {t: 'home'}, token: null};
try { S.token = sessionStorage.getItem('wp_tok'); } catch (e) {}
function tok(t) { S.token = t; try { t ? sessionStorage.setItem('wp_tok', t) : sessionStorage.removeItem('wp_tok'); } catch (e) {} }
var A = {sec: 'set', ed: null, d: null};
var $ = function (q) { return document.querySelector(q); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
var msg = function (e) { return (e && e.message) || String(e); };

function api(action, data, pub) {
  var u = API_URL, opt = {};
  if (pub) {
    u += '?action=' + encodeURIComponent(action) + Object.keys(data || {}).map(function (k) { return '&' + k + '=' + encodeURIComponent(data[k]); }).join('');
  } else {
    // text/plain = "simple request": tidak memicu preflight CORS yang tidak didukung Apps Script
    opt = {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action: action}, data))};
  }
  return fetch(u, opt)
    .catch(function () { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet dan API_URL.'); })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Respons server tidak valid. Pastikan deployment Apps Script diatur "Siapa saja" dan URL berakhiran /exec.'); }
      if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.');
      return j.data;
    });
}
function adm(action, data) { return api(action, Object.assign({token: S.token}, data || {})); }
function toast(t, bad) {
  var e = $('#toast'); e.textContent = t; e.className = bad ? 'bad' : ''; e.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(function () { e.hidden = true; }, 3500);
}
function url(u) {
  u = String(u || '').trim(); if (!u) return '';
  if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
  if (/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)) return 'https://' + u;
  return '';
}
function im(u) {
  u = url(u);
  var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[1] : u;
}
function fd(d) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); if (!m) return d || '';
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
}
function inl(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
}
/* Isi postingan -> HTML aman. Semua teks di-escape dulu; hanya penanda di bawah yang diubah menjadi tag.
   {tengah} {kanan} {rata} di awal paragraf = perataan | ## = judul | "- " = daftar
   **tebal** *miring* __garis bawah__ | [[gambar: link | ukuran | posisi | keterangan]] */
function rich(t) {
  return String(t || '').split(/\n{2,}/).map(function (b) {
    b = b.replace(/^\s+|\s+$/g, ''); if (!b) return '';
    var g = /^\[\[gambar:([^\]]*)\]\]$/.exec(b);
    if (g) {
      var q = g[1].split('|').map(function (x) { return x.trim(); }), u = im(q[0]); if (!u) return '';
      var z = /^(kecil|sedang|besar|penuh)$/.test(q[1]) ? q[1] : 'sedang', ps = /^(kiri|tengah|kanan)$/.test(q[2]) ? q[2] : 'tengah', c = q.slice(3).join(' ').trim();
      return '<figure class="fi z-' + z + ' p-' + ps + '"><img src="' + esc(u) + '" alt="' + esc(c) + '" loading="lazy">' + (c ? '<figcaption>' + esc(c) + '</figcaption>' : '') + '</figure>';
    }
    var al = '', m = /^\{(kiri|tengah|kanan|rata)\}\s*/.exec(b);
    if (m) { al = m[1]; b = b.slice(m[0].length); }
    var cls = al && al !== 'kiri' ? ' class="a-' + al + '"' : '';
    if (/^## /.test(b)) return '<h2' + cls + '>' + inl(b.slice(3)) + '</h2>';
    var ls = b.split('\n');
    if (ls.every(function (l) { return /^- /.test(l); })) return '<ul' + cls + '>' + ls.map(function (l) { return '<li>' + inl(l.slice(2)) + '</li>'; }).join('') + '</ul>';
    return '<p' + cls + '>' + inl(b) + '</p>';
  }).join('');
}

/* ============ SITUS PUBLIK ============ */
function theme() {
  var s = S.s, r = document.documentElement.style, ok = /^#[0-9a-f]{6}$/i;
  r.setProperty('--p', ok.test(s.warna_utama) ? s.warna_utama : '#0F4C5C');
  r.setProperty('--a', ok.test(s.warna_aksen) ? s.warna_aksen : '#B45309');
  document.title = s.judul_halaman || s.nama_usaha || 'Profil Usaha';
  $('#brandName').textContent = s.nama_usaha || '';
  var l = im(s.logo_url);
  $('#logo').innerHTML = l ? '<img class="logo" src="' + esc(l) + '" alt="">' : '<span class="logo">' + esc((s.nama_usaha || 'N').charAt(0).toUpperCase()) + '</span>';
  $('#fl').textContent = s.footer_kiri || '';
  $('#fr').textContent = s.footer_kanan || '';
}
function nav() {
  $('#nav').innerHTML = S.tabs.map(function (t) {
    if (t.tipe === 'link') return '<a class="t" href="' + esc(url(t.isi)) + '" target="_blank" rel="noopener">' + esc(t.nama) + '</a>';
    var on = (t.tipe === 'beranda' && S.cur.t === 'home') || (S.cur.t === 'tab' && S.cur.id === t.id);
    return '<a class="t" href="#" data-tab="' + esc(t.id) + '"' + (on ? ' aria-current="page"' : '') + '>' + esc(t.nama) + '</a>';
  }).join('');
}
function card(p) {
  var i = im(p.gambar);
  return '<a class="card" href="#" data-post="' + esc(p.id) + '">' + (i ? '<img class="ph" src="' + esc(i) + '" alt="" loading="lazy">' : '<div class="ph"></div>') +
    '<div class="cb"><span class="meta">' + esc(fd(p.tanggal)) + '</span><h3>' + esc(p.judul) + '</h3><p>' + esc(p.ringkasan) + '</p><span class="more">Baca selengkapnya</span></div></a>';
}
function home() {
  S.cur = {t: 'home'}; nav();
  var s = S.s, h = im(s.hero_image), b = url(s.tombol_link);
  var btn = s.tombol_teks && b ? '<a class="btn" href="' + esc(b) + '" target="_blank" rel="noopener">' + esc(s.tombol_teks) + '</a>' : '';
  $('#view').innerHTML = '<div class="wrap"><section class="hero"><div><h1>' + esc(s.tagline) + '</h1>' + (s.deskripsi ? '<p>' + esc(s.deskripsi) + '</p>' : '') + btn + '</div>' +
    (h ? '<div><img src="' + esc(h) + '" alt=""></div>' : '') + '</section>' +
    '<section class="posts"><div class="sh"><h2>' + esc(s.judul_postingan) + '</h2>' + (S.total > S.latest.length ? '<a href="#" data-all>Lihat semua</a>' : '') + '</div>' +
    (S.latest.length ? '<div class="grid">' + S.latest.map(card).join('') + '</div>' : '<p class="meta">Belum ada postingan.</p>') + '</section></div>';
  window.scrollTo(0, 0);
}
function loading() { $('#view').innerHTML = '<div class="wrap"><p class="meta pad">Memuat…</p></div>'; window.scrollTo(0, 0); }
function fail(e) { $('#view').innerHTML = '<div class="wrap"><p class="pad">Gagal memuat: ' + esc(msg(e)) + ' <a href="#" data-back>Kembali</a></p></div>'; }
function postView(id) {
  S.cur = {t: 'post'}; nav(); loading();
  api('post', {id: id}, 1).then(function (p) {
    var i = im(p.gambar);

  if (e.key === 'Enter' && /^ip_(url|k)$/.test(e.target.id)) { e.preventDefault(); insImg(); }
});
$('#ac').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target, k = f.dataset.form, v = vals(f), btn = f.querySelector('[type=submit]');
  btn.disabled = true;
  var p;
  if (k === 'set') p = adm('saveSettings', {data: v}).then(function (s) { A.d.settings = s; toast('Pengaturan disimpan.'); });
  else if (k === 'post') p = adm('savePost', {post: v}).then(function (l) { A.d.posts = l; A.ed = null; toast('Postingan disimpan.'); });
  else if (k === 'tab') {
    if (v.tipe === 'link' || v.tipe === 'embed') v.isi = url(v.isi) || v.isi;
    p = adm('saveTab', {tab: v}).then(function (l) { A.d.tabs = l; A.ed = null; toast('Tab disimpan.'); });
  } else if (k === 'acc') {
    if (v.n1 !== v.n2) { toast('Ulangi password baru dengan sama persis.', 1); btn.disabled = false; return; }
    p = adm('changePassword', {oldPass: v.o, newPass: v.n1}).then(function () { A.d.mustChange = false; f.reset(); toast('Password diganti.'); });
  }
  guard(p).then(adminRender, function () {}).then(function () { btn.disabled = false; });
});
$('#aview').addEventListener('click', function () { closeAdmin(); refreshPublic().catch(function (e) { toast(msg(e), 1); }); });
$('#aout').addEventListener('click', function () {
  adm('logout').catch(function () {}); tok(null); closeAdmin();
});
function shrink(file) {
  return new Promise(function (ok, no) {
    var r = new FileReader(); r.onerror = no;
    r.onload = function () {
      var g = new Image();
      g.onerror = function () { no(new Error('File gambar tidak dapat dibaca.')); };
      g.onload = function () {
        var k = Math.min(1, 1400 / Math.max(g.width, g.height)), c = document.createElement('canvas');
        c.width = Math.round(g.width * k); c.height = Math.round(g.height * k);
        c.getContext('2d').drawImage(g, 0, 0, c.width, c.height);
        ok(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85));
      };
      g.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

(function boot() {
  if (/GANTI_DENGAN/.test(API_URL)) {
    theme();
    $('#view').innerHTML = '<div class="wrap"><p class="pad">Isi <code>API_URL</code> di bagian atas file index.html dengan URL web app Apps Script Anda.</p></div>';
    return;
  }
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CK)); } catch (e) {}
  if (cached && cached.settings) applyPublic(cached, true); else { theme(); loading(); }
  api('public', {}, 1).then(function (d) {
    try { localStorage.setItem(CK, JSON.stringify(d)); } catch (e) {}
    applyPublic(d, S.cur.t === 'home');
  }).catch(function (e) { if (!cached) fail(e); });
})();
</script>
