<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Usaha</title>
<script>try{var m=localStorage.getItem('wp_theme');document.documentElement.dataset.theme=m==='dark'?'dark':'light';}catch(e){}</script>
<link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgDe9GDtT8FV08iVmLcmqOn_xocE-bhY6Be78iNFq8Y_CGQtnlxXmOngnHjGqHsE4Lffgy4gKGA4MawDftRselAbk5oCNFZoXr8TRTp8vTKHIPMbveqFSgtSjlaBgclRi_qU9NJVBnw4aSpLQ08rHdyJbjfzYhnuez7mafH4RF5FwJ8XulcSiNICmhYwtLK/s320/BUDI%20KOMPUTER.png">
<link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgDe9GDtT8FV08iVmLcmqOn_xocE-bhY6Be78iNFq8Y_CGQtnlxXmOngnHjGqHsE4Lffgy4gKGA4MawDftRselAbk5oCNFZoXr8TRTp8vTKHIPMbveqFSgtSjlaBgclRi_qU9NJVBnw4aSpLQ08rHdyJbjfzYhnuez7mafH4RF5FwJ8XulcSiNICmhYwtLK/s320/BUDI%20KOMPUTER.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0F4C5C;--a:#B45309;--bg:#F4F7F8;--ink:#14262B;--mut:#4A5F66;--line:#D5E1E4;--fld:#8CA3AA;--card:#fff;--pt:#0F4C5C}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--a)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h1,h2,h3{margin:0}
.meta{font-size:13px;color:var(--mut)}
.wrap{max-width:1200px;margin:0 auto;padding-inline:40px;width:100%}
/* header */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:0 auto;padding:0 40px;min-height:56px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"b n l";align-items:center;gap:16px}
.brand{grid-area:b;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800;font-size:18px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800;object-fit:cover}
img.logo{background:none;border-radius:0;object-fit:contain;display:block}
#nav{grid-area:n;display:flex;gap:4px;justify-content:center}
.t{padding:7px 12px;border-radius:8px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.t:hover{background:var(--bg)}
.t[aria-current=page]{background:var(--p);color:#fff;font-weight:700}
.ib{grid-area:l;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--pt);display:grid;place-items:center;cursor:pointer}
main{flex:1}
/* hero */
.hero{display:flex;gap:32px;align-items:center;padding:20px 0 0}
.hero>div{flex:1;min-width:0}
.hero>div:first-child{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hero h1{font-size:36px;line-height:1.15;font-weight:800}
.hero p{margin:0;font-size:15px;line-height:1.5;color:var(--mut);white-space:pre-line}
.hero img{width:100%;height:auto;max-height:min(240px,32vh);object-fit:contain;border-radius:14px;display:block}
.btn{display:inline-block;background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:15px}
.btn.sm{padding:10px 16px}
.bt{background:var(--card);border:1px solid var(--fld);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.bt.dng{color:#B42318;border-color:#B42318}
/* rancangan baru: label, info, layanan, kontak */
.kick{display:inline-block;padding:4px 12px;border-radius:999px;background:#E3EFF1;color:var(--pt);font-weight:700;font-size:13px}
.bs{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{background:var(--a)}
.btn.ghost,.hero .btn.ghost{background:transparent;color:var(--pt);border:1px solid var(--p)}
.info{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;line-height:1.5;color:var(--mut)}
.sec{padding:24px 0 0}
.sec h2{font-size:22px;margin:0 0 12px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sc{background:var(--kc,var(--card));color:var(--kt,var(--ink));border:1px solid var(--kl,var(--line));border-radius:12px;padding:14px}
.sc .n{width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin-bottom:8px}
.sc strong{display:block;font-size:16px}
.sc p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--km,var(--mut))}
.card .meta{color:var(--km,var(--mut))}
.cta{background:var(--p);color:#fff;border-radius:16px;padding:22px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:24px 0 24px}
.cta>div{flex:1 1 320px}
.cta h2{font-size:20px;margin:0 0 6px;color:#fff}
.cta p{margin:0;line-height:1.6;color:#E3EFF1;font-size:14px;white-space:pre-line}
.cta .btn{background:var(--a)}
@media(max-width:639px){.cta{padding:18px}}
/* posts */
.posts{padding:20px 0 0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{display:flex;flex-direction:row;align-items:flex-start;gap:12px;background:var(--kc,var(--card));color:var(--kt,var(--ink));border:1px solid var(--kl,var(--line));border-radius:12px;padding:12px;color:inherit;text-decoration:none;min-width:0}
.card:hover{border-color:var(--pt)}
.ph{width:104px;height:104px;border-radius:8px;background:var(--kl,var(--line));object-fit:contain;display:block;flex:none}
.cb{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.card h3{font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0;font-size:13px;color:var(--km,var(--mut));line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{font-weight:700;font-size:13px;color:var(--a)}
/* artikel & tab */
.art{max-width:760px;margin:0 auto;padding:40px 0}
.art h1{font-size:34px;line-height:1.2;margin:8px 0 20px}
.art img.cover{display:block;width:100%;height:auto;max-height:560px;object-fit:contain;border-radius:14px;margin-bottom:20px}
.art p{line-height:1.8;margin:0 0 16px}
.frame{width:100%;height:75vh;min-height:420px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:block}
.pad{padding:32px 0}
footer{margin-top:20px;background:var(--p);color:#fff;font-size:14px}
.fin{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
/* modal login */
.modal{position:fixed;inset:0;background:rgba(20,38,43,.55);display:grid;place-items:center;z-index:30;padding:16px}
.box{background:var(--card);border-radius:16px;padding:24px;width:min(380px,100%)}
.box h2{font-size:20px;margin-bottom:16px}
.err{color:#B42318;font-size:14px;margin:8px 0 0;min-height:20px}
/* form */
.fg{margin-bottom:16px}
.fg label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.fg small{display:block;color:var(--mut);margin-top:4px;font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;padding:10px 12px;border:1px solid var(--fld);border-radius:8px;background:var(--card)}
input[type=color]{width:56px;height:40px;padding:2px;border:1px solid var(--fld);border-radius:8px;background:var(--card)}
.imgf{display:flex;gap:8px}
/* admin */
#admin{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.ah{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ah b{font-size:18px}
.ab{flex:1;display:flex;min-height:0}
.side{width:220px;background:var(--card);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;flex:none}
.side button{text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;font-weight:600;cursor:pointer}
.side button[aria-current=true]{background:var(--p);color:#fff}
.side svg{display:none}
#ac{flex:1;overflow:auto;padding:24px;min-width:0}
.pane{max-width:760px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.ph2 h2{font-size:22px}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap}
.li>div:first-child{min-width:0;display:flex;flex-direction:column}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.warn{background:#FEF3C7;border:1px solid #B45309;color:#5B2A04;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--mut);margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:40;font-size:14px;max-width:92vw}
#toast.bad{background:#B42318}
/* tablet */
@media(max-width:1023px){
  .bar{padding:8px 24px 0;grid-template-columns:1fr auto;grid-template-areas:"b l" "n n";gap:4px}
  #nav{justify-content:flex-start;overflow-x:auto;padding-bottom:8px}
  .wrap{padding-inline:24px}
  .hero{flex-direction:row;align-items:center;gap:20px;padding-top:16px}
  .hero h1{font-size:30px}
  .hero p{font-size:14px}
  .hero img{max-height:200px}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
}
/* HP */
@media(max-width:639px){
  .bar{padding:8px 16px 0}
  .wrap{padding-inline:16px}
  .hero{flex-direction:column;align-items:stretch;padding-top:12px;gap:10px}
  .hero h1{font-size:24px}
  .hero p{font-size:14px}
  .hero img{max-height:150px;border-radius:12px}
  .grid{grid-template-columns:1fr;gap:8px}
  .card{padding:10px}
  .card .ph{width:80px;height:80px}
  .card h3{font-size:15px}
  .card p{display:none}
  .art h1{font-size:26px}
  .ab{flex-direction:column;overflow-y:auto;overflow-x:hidden}
  .side{width:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);flex:none}
  .side button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:76px;padding:10px 4px;font-size:12.5px;line-height:1.2;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow-wrap:anywhere}
  .side button[aria-current=true]{border-color:var(--p)}
  .side svg{display:block;width:24px;height:24px;flex:none}
  #ac{padding:16px;flex:none;overflow:visible}
}
@media(min-width:1024px) and (max-height:760px){
  .hero{padding-top:12px}
  .hero h1{font-size:30px}
  .hero p{font-size:14px}
  .hero img{max-height:190px}
  .info{margin-top:10px;padding:8px 14px}
  .posts{padding-top:14px}
}
/* layanan: HP = bottom sheet */
.sheet{position:fixed;inset:0;z-index:25;background:rgba(20,38,43,.55);display:flex;align-items:flex-end}
.sheet .sp{background:var(--card);width:100%;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sup .22s ease-out}
.sheet .sph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .sph h2{font-size:20px;margin:0}
.sheet .svc{grid-template-columns:1fr;gap:8px}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:639px){#layanan{display:none}}
/* teks kaya (isi postingan) */
.rt{display:flow-root}
.rt p,.rt ul{margin:0 0 16px;line-height:1.8}
.rt ul{padding-left:24px}
.rt h2{font-size:24px;line-height:1.3;margin:28px 0 12px}
.rt .a-tengah{text-align:center}
.rt .a-kanan{text-align:right}
.rt .a-rata{text-align:justify}
.rt ul.a-tengah,.rt ul.a-kanan{list-style-position:inside;padding-left:0}
.rt figure.fi{margin:8px 0 20px;padding:0}
.rt figure.fi img{display:block;width:100%;height:auto;max-height:none;object-fit:initial;border-radius:10px;margin:0;background:var(--line)}
.rt .fi figcaption{font-size:13px;color:var(--mut);margin-top:6px;text-align:center;line-height:1.5}
.rt .fi.z-kecil{width:min(220px,100%)}
.rt .fi.z-sedang{width:min(400px,100%)}
.rt .fi.z-besar{width:min(600px,100%)}
.rt .fi.z-penuh{width:100%}
.rt .fi.p-tengah{margin-left:auto;margin-right:auto}
.rt .fi.p-kanan{margin-left:auto}
@media(min-width:640px){
  .rt .fi.p-kiri:not(.z-penuh){float:left;margin:6px 20px 12px 0}
  .rt .fi.p-kanan:not(.z-penuh){float:right;margin:6px 0 12px 20px}
}
/* ukuran teks per kolom */
.szr{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.fg .szr label{display:inline;margin:0;font-weight:600;font-size:13px;color:var(--mut)}
.szr input[type=range]{flex:1;min-width:120px;accent-color:var(--pt)}
.szr input[type=number]{width:84px}
/* toolbar editor */
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.tb .bt{padding:7px 10px;min-width:38px;display:inline-flex;align-items:center;justify-content:center}
.tb .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.ipn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px}
.ipn .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:460px;overflow:auto}
@media(max-width:639px){.ipn .row{grid-template-columns:1fr;gap:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* mode gelap */
:root[data-theme=dark]{--bg:#0E1A1D;--ink:#E6EEF0;--mut:#A3B8BE;--line:#27393E;--fld:#587077;--card:#162327;color-scheme:dark}
[data-theme=dark] .kick{background:#1E3A41}
:root[data-theme=dark] .i-moon,:root:not([data-theme=dark]) .i-sun{display:none}
.hr{grid-area:l;display:flex;gap:8px}.hr .ib{grid-area:auto}
.shr{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.bar2{display:flex;align-items:center;gap:12px}.bar2 .bg{flex:1;height:10px;border-radius:6px;background:var(--line)}.bar2 .bg i{display:block;height:100%;border-radius:6px;background:var(--pt)}.bar2 span:first-child{width:110px;font-size:13px}.bar2 b{min-width:32px;text-align:right}
/* presensi */
input[type=time]{width:100%;padding:10px 12px;border:1px solid var(--fld);border-radius:8px;background:var(--card)}
.pg{max-width:560px;margin:0 auto;padding:24px 0 40px;display:flex;flex-direction:column;gap:14px}
.phd{background:var(--p);color:#fff;border-radius:18px;padding:20px 22px}
.phd small{display:block;color:#E3EFF1;font-size:13px}
.phd b{display:block;font-size:20px;margin:2px 0}
.pclk{font-size:46px;font-weight:800;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.pc h3{font-size:16px;margin-bottom:6px}
.pdu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pdu>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.pdu b{font-size:26px;line-height:1.2}
.pst{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.pn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--ink);font-weight:800;display:grid;place-items:center}
.pst.ok .pn{background:#15803D;color:#fff}
.pst.bad .pn{background:#B42318;color:#fff}
.pb{flex:1;min-width:0;display:flex;flex-direction:column}
.pb img{width:72px;height:72px;object-fit:cover;border-radius:10px;margin-top:6px}
.pbtn{width:100%;font-size:18px;padding:16px;border-radius:14px}
.pbtn:disabled,.bt:disabled{opacity:.5;cursor:not-allowed}
#pcam video{width:100%;border-radius:12px;background:#000;max-height:60vh}
#pcam .pcb{width:min(420px,100%)}
.mir{transform:scaleX(-1)}
.pgl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:pointer;font-family:inherit;color:inherit}
.pgl b{font-size:26px;line-height:1.2}
.pgl.on{border-color:var(--p);box-shadow:inset 0 0 0 2px var(--p)}
.pgl.on b{color:var(--p)}
.pseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pseg button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-family:inherit;color:inherit;cursor:pointer}
.pseg .on{background:var(--p);color:#fff;border-color:var(--p)}
.ptw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.ptb{border-collapse:collapse;font-size:12px;width:100%}
.ptb th,.ptb td{border:1px solid var(--line);padding:6px 4px;text-align:center;min-width:26px}
.ptb th{background:var(--bg,#f1f5f6);position:sticky;top:0;z-index:1}
.ptb .pnm{text-align:left;min-width:130px;position:sticky;left:0;background:var(--card);z-index:1}
.ptb th.pnm{z-index:2;background:var(--bg,#f1f5f6)}
.ptb .off{background:var(--bg,#f1f5f6)}
.ptb td[data-act]{cursor:pointer}
.ptb .ptot{min-width:34px;font-weight:700}
.cH{color:#15803D;font-weight:700}.cT{color:#B45309;font-weight:700}.cI{color:#1D4ED8;font-weight:700}.cS{color:#7C3AED;font-weight:700}.cA{color:#B42318;font-weight:700}
.bdg{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bg,#f1f5f6);border:1px solid var(--line)}
.pb textarea{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--fld);border-radius:8px;background:var(--card);font:inherit;color:inherit}

/* ===================== rev.23: pop up, toast, modal ===================== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.93)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal,.sheet,.dlg{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{background:rgba(10,24,28,.6);animation:fadeIn .18s ease-out}
.box{border-radius:24px;padding:26px 24px 22px;border:1px solid var(--line);box-shadow:0 30px 70px -16px rgba(0,0,0,.55);animation:popIn .24s cubic-bezier(.2,.9,.3,1.2)}
.box h2{font-size:20px;margin-bottom:14px}
.mhd{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mhd h2{margin:0}.mhd .meta{margin:2px 0 0}
.dico{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--p);color:#fff;box-shadow:0 8px 18px -8px var(--p)}
.sheet{background:rgba(10,24,28,.6);animation:fadeIn .18s ease-out}
.sheet .sp{border-radius:24px 24px 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.5)}

.pc{box-shadow:0 8px 24px -18px rgba(0,0,0,.4)}

/* Dialog konfirmasi cantik pengganti confirm(): ask({judul, html, catatan, ya, tidak, info}) -> Promise<boolean> */
function ask(o) {

    var prev = document.activeElement, d = document.createElement('div');

function shrink(file) {
  return new Promise(function (ok, no) {
    var r = new FileReader(); r.onerror = no;
    r.onload = function () {
      var g = new Image();
      g.onerror = function () { no(new Error('File gambar tidak dapat dibaca.')); };
      g.onload = function () {
        var k = Math.min(1, 1400 / Math.max(g.width, g.height)), c = document.createElement('canvas');
        c.width = Math.round(g.width * k); c.height = Math.round(g.height * k);
        c.getContext('2d').drawImage(g, 0, 0, c.width, c.height);
        ok(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85));
      };
      g.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
